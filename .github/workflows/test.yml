name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Checker tests
        run: |
          python -m pip install --quiet --require-hashes -r tools/requirements.txt
          python -m unittest discover -s tools/tests -v
      - name: Semgrep rule tests
        run: |
          python -m venv /tmp/sg && /tmp/sg/bin/pip install --quiet --require-hashes -r tools/requirements-sast.txt
          /tmp/sg/bin/semgrep --test --metrics off semgrep
      - name: Budgets example validates
        run: python -c "import json,jsonschema; jsonschema.Draft202012Validator(json.load(open('templates/budgets.schema.json'))).validate(json.load(open('templates/budgets.example.json')))"
      - name: Shell scripts parse
        run: bash -n tools/audit.sh tools/fetch-tool.sh
      - name: The policy repo pins its own actions (DEP-7)
        run: python tools/policy_check.py pins

  actions:
    # Runs the composite actions on fixture projects: the good one must pass, the bad one must fail each check.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Conformance passes on the good fixture
        uses: ./actions/conformance
        with:
          working-directory: fixtures/good-project
      - name: Dependency scan passes on the good fixture
        uses: ./actions/vulns
        with:
          working-directory: fixtures/good-project
      - name: Static analysis passes on the good fixture
        uses: ./actions/sast
        with:
          working-directory: fixtures/good-project
      - name: Conformance passes on the good web fixture (pinned browserslist, no CSP needed at T1)
        uses: ./actions/conformance
        with:
          working-directory: fixtures/good-web-project
      - name: Static analysis passes on a web project with no inline scripts
        uses: ./actions/sast
        with:
          working-directory: fixtures/good-web-project
      - id: bad-conformance
        name: Conformance fails on the bad fixture
        continue-on-error: true
        uses: ./actions/conformance
        with:
          working-directory: fixtures/bad-project
      - id: bad-vulns
        name: Dependency scan fails on the bad fixture
        continue-on-error: true
        uses: ./actions/vulns
        with:
          working-directory: fixtures/bad-project
      - id: bad-sast
        name: Static analysis fails on the bad fixture
        continue-on-error: true
        uses: ./actions/sast
        with:
          working-directory: fixtures/bad-project
      - name: The bad fixture failed every check
        env:
          RESULTS: ${{ steps.bad-conformance.outcome }} ${{ steps.bad-vulns.outcome }} ${{ steps.bad-sast.outcome }}
        run: |
          echo "bad fixture outcomes: $RESULTS"
          [[ $RESULTS == "failure failure failure" ]]
      - name: Secrets scan passes on this repository
        uses: ./actions/secrets
