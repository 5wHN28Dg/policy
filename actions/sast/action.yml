name: Policy static analysis
description: >-
  WEB-9 and WEB-10 sink rules for projects with an HTML UI (web, webview, engine-bundling) from T1, plus
  Section 5 static security analysis (Semgrep's default ruleset, blocking on ERROR) from full T2.
inputs:
  working-directory:
    description: The project root, relative to the workspace (for monorepos and tests).
    default: '.'
runs:
  using: composite
  steps:
    - id: plan
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
      run: |
        header=$(python3 "${{ github.action_path }}/../../tools/policy_check.py" header --root .)
        python3 - "$header" >> "$GITHUB_OUTPUT" <<'PY'
        import json, sys
        h = json.loads(sys.argv[1])
        tier = int(h["tier"][1]) if h["tier"] and h["tier"][:1] == "T" and h["tier"][1:].isdigit() else 2
        web = bool({"web", "webview", "engine-bundling"} & set(h["types"]))
        full = tier >= 2 and not h["lighter_t2"]
        print(f"web={'true' if web and tier >= 1 else 'false'}")
        print(f"full={'true' if full else 'false'}")
        PY
    - if: steps.plan.outputs.web == 'true' || steps.plan.outputs.full == 'true'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'
    - if: steps.plan.outputs.web == 'true' || steps.plan.outputs.full == 'true'
      shell: bash
      run: python -m pip install --quiet --disable-pip-version-check --require-hashes -r "${{ github.action_path }}/../../tools/requirements-sast.txt"
    - if: steps.plan.outputs.web == 'true' || steps.plan.outputs.full == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
      env:
        WEB: ${{ steps.plan.outputs.web }}
        FULL: ${{ steps.plan.outputs.full }}
      run: |
        tools="${{ github.action_path }}/../../tools"
        rules="${{ github.action_path }}/../../semgrep/web-sinks.yml"
        out="$RUNNER_TEMP/policy-sast"
        rm -rf "$out" && mkdir -p "$out/inline"
        configs=()
        [[ $WEB == true ]] && configs+=(--config "$rules")
        [[ $FULL == true ]] && configs+=(--config p/default)
        # Exit 0 or 1 is a completed scan; the gate below decides what blocks (Section 5, WEB-9, WEB-10).
        semgrep scan --metrics off --json --output "$out/repo.json" --exclude "*.min.js" "${configs[@]}" . || [[ $? -eq 1 ]]
        reports=(--report "$out/repo.json")
        if [[ $WEB == true ]]; then
          # Inline <script> blocks: Semgrep doesn't parse JavaScript inside HTML, so scan extracted copies.
          python3 "$tools/policy_check.py" extract-inline --root . --out "$out/inline"
          mapfile -t copies < <(python3 -c 'import json,sys; sys.stdout.write("".join(p + "\n" for p in json.load(open(sys.argv[1]))))' "$out/inline/inline-map.json")
          if [[ ${#copies[@]} -gt 0 ]]; then
            semgrep scan --metrics off --json --output "$out/inline.json" --config "$rules" "${copies[@]}" || [[ $? -eq 1 ]]
            reports+=(--report "$out/inline.json")
          fi
        fi
        python3 "$tools/policy_check.py" sast "${reports[@]}" --map "$out/inline/inline-map.json"
