name: Policy PR review (Claude)
description: >-
  Fresh-context AI review of a pull request against the policy (governance Section 6 and the applicable standards),
  the solo substitute for an independent reviewer in Section 11. Posts inline comments and one summary comment.
  Advisory: it never fails the check. Needs actions/checkout with fetch-depth 0, and permissions
  contents: read, pull-requests: write.
inputs:
  claude-code-oauth-token:
    description: Token from `claude setup-token` (Claude Pro or Max), stored as a repository secret.
    required: true
  github-token:
    description: Token for posting comments.
    default: ${{ github.token }}
  model:
    description: Claude model to use (empty for the default).
    default: ''
  hide:
    description: >-
      Space-separated paths removed from the checkout before the review, so the blind pass doesn't see the
      author's reasoning (Section 11).
    default: CLAUDE.md CLAUDE.local.md .claude
runs:
  using: composite
  steps:
    - id: prep
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        HIDE: ${{ inputs.hide }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        REPOSITORY: ${{ github.repository }}
        POLICY_DIR: ${{ github.action_path }}/../..
      run: |
        if [[ -z $PR_NUMBER ]]; then echo "::error::claude-review runs on pull_request events only"; exit 1; fi
        for p in $HIDE; do rm -rf -- "./$p"; done
        git fetch --quiet --no-tags origin "$BASE_SHA" || true
        policy_dir=$(cd "$POLICY_DIR" && pwd)
        pr_file="$RUNNER_TEMP/policy-pr.md"
        out_file="$RUNNER_TEMP/policy-review.md"
        printf '# %s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$pr_file"
        python3 - "$policy_dir/prompts/pr-review.md" > "$RUNNER_TEMP/policy-prompt.md" <<PY
        import sys
        text = open(sys.argv[1], encoding="utf-8").read()
        for k, v in {"POLICY_DIR": "$policy_dir", "PR_NUMBER": "$PR_NUMBER", "REPOSITORY": "$REPOSITORY",
                     "PR_FILE": "$pr_file", "BASE_SHA": "$BASE_SHA", "HEAD_SHA": "$HEAD_SHA",
                     "OUTPUT_FILE": "$out_file"}.items():
            text = text.replace("{{" + k + "}}", v)
        print(text)
        PY
        {
          echo "policy-dir=$policy_dir"
          echo "out-file=$out_file"
          echo "prompt<<POLICY_PROMPT_EOF"
          cat "$RUNNER_TEMP/policy-prompt.md"
          echo "POLICY_PROMPT_EOF"
        } >> "$GITHUB_OUTPUT"
    - uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
      continue-on-error: true
      with:
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        github_token: ${{ inputs.github-token }}
        prompt: ${{ steps.prep.outputs.prompt }}
        classify_inline_comments: false
        claude_args: >-
          ${{ inputs.model && format('--model {0}', inputs.model) || '' }}
          --add-dir ${{ steps.prep.outputs.policy-dir }} ${{ runner.temp }}
          --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Write,mcp__github_inline_comment__create_inline_comment"
    - shell: bash
      if: always()
      working-directory: ${{ github.workspace }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        OUT_FILE: ${{ steps.prep.outputs.out-file }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        marker='<!-- policy-claude-review -->'
        if [[ -s $OUT_FILE ]]; then body=$(cat "$OUT_FILE"); else
          body=$'## Policy review: not completed\n\nThe Claude review step did not produce a summary. See the workflow log.'
        fi
        body="$marker"$'\n'"$body"
        id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
               -q ".[] | select(.body | startswith(\"$marker\")) | .id" | tail -1)
        if [[ -n $id ]]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
        else
          gh pr comment "$PR_NUMBER" --body "$body"
        fi
        cat "$OUT_FILE" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
