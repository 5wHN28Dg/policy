name: Policy secrets scan
description: >-
  Section 5, secrets in code and history: gitleaks over the whole git history, blocking on every tier (T0 included).
  Run after actions/checkout with fetch-depth 0.
runs:
  using: composite
  steps:
    - shell: bash
      run: >-
        "${{ github.action_path }}/../../tools/fetch-tool.sh" gitleaks
        https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb gitleaks
    - shell: bash
      working-directory: ${{ github.workspace }}
      env:
        BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
      run: |
        # A .gitleaks.toml must extend the default rules, and a PR that changes it says why (it configures this scan).
        args=(secrets-config --root .)
        if [[ -n $BASE_REF ]]; then
          git fetch --quiet --no-tags origin "${BASE_REF#origin/}" || true
          args+=(--base "$BASE_REF")
        fi
        python3 "${{ github.action_path }}/../../tools/policy_check.py" "${args[@]}"
    - shell: bash
      working-directory: ${{ github.workspace }}
      run: gitleaks git --redact --no-banner --exit-code 1 --report-format sarif --report-path "$RUNNER_TEMP/gitleaks.sarif" .
