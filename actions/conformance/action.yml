name: Policy conformance
description: >-
  Checks the parts of the policy a file or a diff can prove: the README header (tier, policy version, type),
  required files per tier, budgets.json against the schema, loosened budgets, DEP-7 pins, and the WEB-1
  resolved browser list. Run after actions/checkout with fetch-depth 0.
inputs:
  base-ref:
    description: Git ref of the PR base, to detect loosened budgets. Defaults to the PR's base branch.
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'
    - shell: bash
      run: python -m pip install --quiet --disable-pip-version-check -r "${{ github.action_path }}/../../tools/requirements.txt"
    - shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref || (github.base_ref && format('origin/{0}', github.base_ref)) || '' }}
      run: |
        args=(conformance --root "$GITHUB_WORKSPACE")
        if [[ -n $BASE_REF ]]; then
          git -C "$GITHUB_WORKSPACE" fetch --quiet --no-tags origin "${BASE_REF#origin/}" || true
          args+=(--base "$BASE_REF")
        fi
        python "${{ github.action_path }}/../../tools/policy_check.py" "${args[@]}"
