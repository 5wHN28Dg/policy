name: Policy conformance
description: >-
  Checks the parts of the policy a file or a diff can prove: the README header (tier, policy version, type),
  required files per tier, budgets.json against the schema, loosened budgets, DEP-7 pins, and the WEB-1
  resolved browser list. Run after actions/checkout with fetch-depth 0.
inputs:
  working-directory:
    description: The project root, relative to the workspace (for monorepos and tests).
    default: '.'
  base-ref:
    description: Git ref of the PR base, to detect loosened budgets. Defaults to the PR's base branch.
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'
    - shell: bash
      run: python -m pip install --quiet --disable-pip-version-check --require-hashes -r "${{ github.action_path }}/../../tools/requirements.txt"
    - shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
      run: |
        # The WEB-1 check's browserslist, pinned by the policy's lockfile (npm ci verifies each package's integrity).
        # Only web projects need it.
        types=$(python3 "${{ github.action_path }}/../../tools/policy_check.py" header --root . | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)["types"]))')
        [[ " $types " == *" web "* ]] || exit 0
        npm ci --silent --ignore-scripts --no-audit --no-fund --prefix "${{ github.action_path }}/../../tools/browserslist"
        echo "BROWSERSLIST_BIN=$(cd "${{ github.action_path }}/../../tools/browserslist" && pwd)/node_modules/.bin/browserslist" >> "$GITHUB_ENV"
    - shell: bash
      env:
        PROJECT_DIR: ${{ inputs.working-directory }}
        BASE_REF: ${{ inputs.base-ref || (github.base_ref && format('origin/{0}', github.base_ref)) || '' }}
      run: |
        args=(conformance --root "$GITHUB_WORKSPACE/$PROJECT_DIR")
        if [[ -n $BASE_REF ]]; then
          git -C "$GITHUB_WORKSPACE" fetch --quiet --no-tags origin "${BASE_REF#origin/}" || true
          args+=(--base "$BASE_REF")
        fi
        python "${{ github.action_path }}/../../tools/policy_check.py" "${args[@]}"
